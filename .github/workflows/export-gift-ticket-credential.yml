name: Export encrypted CORESERVER API credential

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    env:
      CORESERVER_API_KEY: ${{ secrets.CORESERVER_API_KEY }}
      EXPORT_PUBLIC_KEY: ${{ secrets.GIFT_TICKET_EXPORT_PUBLIC_KEY }}
    steps:
      - name: Encrypt credential for the local migration key
        run: |
          set -euo pipefail
          printf '%s\n' "${EXPORT_PUBLIC_KEY}" > "${RUNNER_TEMP}/export-public.pem"
          printf '%s' "${CORESERVER_API_KEY}" | openssl pkeyutl -encrypt \
            -pubin \
            -inkey "${RUNNER_TEMP}/export-public.pem" \
            -pkeyopt rsa_padding_mode:oaep \
            -pkeyopt rsa_oaep_md:sha256 \
            -out "${RUNNER_TEMP}/coreserver-api-key.enc"
      - uses: actions/upload-artifact@v4
        with:
          name: encrypted-coreserver-api-key
          path: ${{ runner.temp }}/coreserver-api-key.enc
          if-no-files-found: error
          retention-days: 1
