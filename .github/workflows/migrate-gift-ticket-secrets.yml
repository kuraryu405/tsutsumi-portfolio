name: Migrate gift ticket deployment credentials

on:
  workflow_dispatch:
    inputs:
      local_ip:
        description: Local public IPv4 to allow after provisioning
        required: true
        type: string

permissions:
  contents: read

jobs:
  migrate:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GIFT_TICKET_MIGRATION_TOKEN }}
      TARGET_REPOSITORY: kuraryu405/gift-ticket
      SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
      SFTP_HOST: ${{ secrets.SFTP_HOST }}
      SFTP_USER: ${{ secrets.SFTP_USER }}
      SFTP_PORT: ${{ secrets.SFTP_PORT }}
      CORESERVER_API_KEY: ${{ secrets.CORESERVER_API_KEY }}
      ADMIN_PASSWORD_HASH: ${{ secrets.GIFT_TICKET_ADMIN_HASH }}
      VOUCHER_CODE_SECRET: ${{ secrets.GIFT_TICKET_VOUCHER_SECRET }}
      RATE_LIMIT_SECRET: ${{ secrets.GIFT_TICKET_RATE_SECRET }}
      CORESERVER_ACCOUNT: kuraryu
      CORESERVER_SERVER_NAME: m34.coreserver.jp
      DB_NAME: kuraryu_gift
      APP_URL: https://kuraryu.jp/gift-ticket
    steps:
      - name: Copy credentials and provision CORESERVER
        shell: bash
        run: |
          set -euo pipefail
          ssh_port="${SFTP_PORT:-22}"

          allow_ip() {
            local address="$1"
            local response
            response="$(curl --fail --silent --show-error --max-time 30 \
              -X POST 'https://api.coreserver.jp/v1/tool/ssh_ip_allow' \
              --data-urlencode "account=${CORESERVER_ACCOUNT}" \
              --data-urlencode "server_name=${CORESERVER_SERVER_NAME}" \
              --data-urlencode "api_secret_key=${CORESERVER_API_KEY}" \
              --data-urlencode "param[addr]=${address}")"
            # PHP code is intentionally literal.
            # shellcheck disable=SC2016
            RESPONSE="${response}" php -r '$body=json_decode((string)getenv("RESPONSE"), true); exit(($body["status_code"] ?? 0) === 200 ? 0 : 1);'
          }

          runner_ip="$(curl --fail --silent --show-error --max-time 15 https://api.ipify.org)"
          allow_ip "${runner_ip}"

          install -m 0700 -d "${HOME}/.ssh"
          printf '%s\n' "${SSH_PRIVATE_KEY}" > "${RUNNER_TEMP}/deploy_key"
          chmod 0600 "${RUNNER_TEMP}/deploy_key"
          known_hosts=''
          for _ in {1..24}; do
            known_hosts="$(ssh-keyscan -T 5 -p "${ssh_port}" "${SFTP_HOST}" 2>/dev/null || true)"
            [[ -n "${known_hosts}" ]] && break
            sleep 15
          done
          [[ -n "${known_hosts}" ]] || { echo 'Unable to obtain the SSH host key' >&2; exit 1; }
          printf '%s\n' "${known_hosts}" > "${HOME}/.ssh/known_hosts"
          chmod 0600 "${HOME}/.ssh/known_hosts"
          ssh-keygen -lf "${HOME}/.ssh/known_hosts"

          remote_home="$(ssh -i "${RUNNER_TEMP}/deploy_key" -p "${ssh_port}" -o BatchMode=yes -o StrictHostKeyChecking=yes "${SFTP_USER}@${SFTP_HOST}" pwd)"
          [[ "${remote_home}" =~ ^/virtual/[A-Za-z0-9._-]+$ ]] || { echo 'Unexpected remote home' >&2; exit 1; }

          php_bin=''
          for candidate in /usr/local/bin/php85cli /usr/local/bin/php84cli /usr/local/bin/php83cli /usr/local/bin/php82cli php /usr/local/bin/php85 /usr/local/bin/php84 /usr/local/bin/php83 /usr/local/bin/php82; do
            if ssh -i "${RUNNER_TEMP}/deploy_key" -p "${ssh_port}" -o BatchMode=yes -o StrictHostKeyChecking=yes "${SFTP_USER}@${SFTP_HOST}" "${candidate} -r 'exit(PHP_VERSION_ID >= 80200 ? 0 : 1);'" >/dev/null 2>&1; then
              php_bin="${candidate}"
              break
            fi
          done
          [[ -n "${php_bin}" ]] || { echo 'PHP 8.2+ CLI was not found' >&2; exit 1; }

          db_list="$(curl --fail --silent --show-error --max-time 30 \
            -X POST 'https://api.coreserver.jp/v1/db/list' \
            --data-urlencode "account=${CORESERVER_ACCOUNT}" \
            --data-urlencode "server_name=${CORESERVER_SERVER_NAME}" \
            --data-urlencode "api_secret_key=${CORESERVER_API_KEY}" \
            --data-urlencode 'db_type=mysql')"
          db_password="$(jq -r --arg name "${DB_NAME}" '(.result // {}) | to_entries[] | select(.value.db_name == $name) | .value.db_pass' <<<"${db_list}" | head -n 1)"
          if [[ -z "${db_password}" || "${db_password}" == 'null' ]]; then
            db_password="$(openssl rand -hex 16)"
            add_response="$(curl --fail --silent --show-error --max-time 30 \
              -X POST 'https://api.coreserver.jp/v1/db/add' \
              --data-urlencode "account=${CORESERVER_ACCOUNT}" \
              --data-urlencode "server_name=${CORESERVER_SERVER_NAME}" \
              --data-urlencode "api_secret_key=${CORESERVER_API_KEY}" \
              --data-urlencode 'db_type=mysql' \
              --data-urlencode "param[db_name]=${DB_NAME}" \
              --data-urlencode "param[db_pass]=${db_password}" \
              --data-urlencode 'param[code]=unicode' \
              --data-urlencode 'param[memo]=gift-ticket')"
            # PHP code is intentionally literal.
            # shellcheck disable=SC2016
            RESPONSE="${add_response}" php -r '$body=json_decode((string)getenv("RESPONSE"), true); exit(($body["status_code"] ?? 0) === 200 ? 0 : 1);'
          fi

          public_path="${remote_home}/public_html/kuraryu.jp/gift-ticket"
          app_path="${remote_home}/gift-ticket-app"
          config_file="${RUNNER_TEMP}/config.php"
          DB_PASSWORD="${db_password}" APP_PATH="${app_path}" php <<'PHP' > "${config_file}"
          <?php
          declare(strict_types=1);
          return [
              'app_env' => 'production',
              'app_url' => 'https://kuraryu.jp/gift-ticket',
              'app_timezone' => 'Asia/Tokyo',
              'db' => [
                  'host' => 'localhost',
                  'port' => 3306,
                  'name' => 'kuraryu_gift',
                  'user' => 'kuraryu_gift',
                  'password' => (string) getenv('DB_PASSWORD'),
              ],
              'voucher_code_secret' => (string) getenv('VOUCHER_CODE_SECRET'),
              'rate_limit_secret' => (string) getenv('RATE_LIMIT_SECRET'),
              'admin_password_hash' => (string) getenv('ADMIN_PASSWORD_HASH'),
              'line_channel_access_token' => '',
              'line_user_id' => '',
              'session_name' => 'gift_ticket_admin',
              'session_lifetime_seconds' => 3600,
              'redeem_rate_limit' => 10,
              'redeem_rate_window_seconds' => 900,
              'login_rate_limit' => 5,
              'login_rate_window_seconds' => 900,
              'code_min_length' => 4,
              'code_max_length' => 32,
          ];
          PHP
          ssh -i "${RUNNER_TEMP}/deploy_key" -p "${ssh_port}" -o BatchMode=yes -o StrictHostKeyChecking=yes "${SFTP_USER}@${SFTP_HOST}" "umask 077; mkdir -p '${app_path}/shared'; cat > '${app_path}/shared/config.php'" < "${config_file}"

          printf '%s' "${SSH_PRIVATE_KEY}" | gh secret set CORE_SSH_PRIVATE_KEY --repo "${TARGET_REPOSITORY}"
          printf '%s' "${known_hosts}" | gh secret set CORE_SSH_KNOWN_HOSTS --repo "${TARGET_REPOSITORY}"
          printf '%s' "${CORESERVER_API_KEY}" | gh secret set CORESERVER_API_KEY --repo "${TARGET_REPOSITORY}"
          gh variable set CORE_SSH_HOST --repo "${TARGET_REPOSITORY}" --body "${SFTP_HOST}"
          gh variable set CORE_SSH_PORT --repo "${TARGET_REPOSITORY}" --body "${ssh_port}"
          gh variable set CORE_SSH_USER --repo "${TARGET_REPOSITORY}" --body "${SFTP_USER}"
          gh variable set CORE_REMOTE_PUBLIC_PATH --repo "${TARGET_REPOSITORY}" --body "${public_path}"
          gh variable set CORE_REMOTE_APP_PATH --repo "${TARGET_REPOSITORY}" --body "${app_path}"
          gh variable set CORE_PHP_BIN --repo "${TARGET_REPOSITORY}" --body "${php_bin}"
          gh variable set APP_URL --repo "${TARGET_REPOSITORY}" --body "${APP_URL}"
          gh variable set CORESERVER_ACCOUNT --repo "${TARGET_REPOSITORY}" --body "${CORESERVER_ACCOUNT}"
          gh variable set CORESERVER_SERVER_NAME --repo "${TARGET_REPOSITORY}" --body "${CORESERVER_SERVER_NAME}"
          gh api --method PUT "repos/${TARGET_REPOSITORY}/environments/production" >/dev/null

          allow_ip "${{ inputs.local_ip }}"
          echo 'Credential migration and server provisioning completed.'
